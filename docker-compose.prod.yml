version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_NAME=${SUPABASE_DB_NAME}
      - DATABASE_USER=${SUPABASE_DB_USER}
      - DATABASE_PASSWORD=${SUPABASE_DB_PASSWORD}
      - DATABASE_HOST=${SUPABASE_DB_HOST}
      - DATABASE_PORT=${SUPABASE_DB_PORT}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    networks:
      - school_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: school_frontend
    volumes:
      - frontend_build:/app/dist
    networks:
      - school_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: school_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - static_volume:/var/www/static
      - media_volume:/var/www/media
      - frontend_build:/var/www/html
    depends_on:
      - backend
      - frontend
    networks:
      - school_network
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
  frontend_build:

networks:
  school_network:
    driver: bridge

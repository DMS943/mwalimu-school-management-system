apiVersion: v1
kind: ConfigMap
metadata:
  name: school-config
  namespace: mwalimu-school
data:
  ENVIRONMENT: "production"
  DEBUG: "False"
  ALLOWED_HOSTS: "yourschool.com,www.yourschool.com"
  CORS_ALLOWED_ORIGINS: "https://yourschool.com,https://www.yourschool.com"
  REDIS_URL: "redis://redis-service:6379/0"
  BACKUP_DIR: "/opt/backups"
  BACKUP_RETENTION_DAYS: "90"
  GUNICORN_WORKERS: "4"
  GUNICORN_WORKER_CLASS: "gevent"
  GUNICORN_WORKER_CONNECTIONS: "1000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: mwalimu-school
data:
  nginx.conf: |
    upstream backend {
        least_conn;
        server backend-service:8000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    server {
        listen 80;
        server_name yourschool.com www.yourschool.com;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
    
    server {
        listen 443 ssl http2;
        server_name yourschool.com www.yourschool.com;
        
        ssl_certificate /etc/ssl/certs/tls.crt;
        ssl_certificate_key /etc/ssl/certs/tls.key;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Frontend static files
        location / {
            root /var/www/html;
            try_files $uri $uri/ /index.html;
            
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
        
        # API endpoints
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # Static files
        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Media files
        location /media/ {
            alias /var/www/media/;
            expires 1M;
            add_header Cache-Control "public";
        }
        
        # Health check
        location /health {
            proxy_pass http://backend/monitoring/health/;
            access_log off;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: mwalimu-school
data:
  redis.conf: |
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    timeout 300
    tcp-keepalive 60
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
    appendfsync everysec
# Kubernetes Secrets for Mwalimu School Management System
# NOTE: In production, use external secret management like AWS Secrets Manager, HashiCorp Vault, etc.

apiVersion: v1
kind: Secret
metadata:
  name: school-secrets
  namespace: mwalimu-school
  labels:
    app: school
type: Opaque
data:
  # Base64 encoded secrets - replace with actual values
  secret-key: "WU9VUl9TRUNSRVRF"  # echo -n 'YOUR_SECRET_KEY' | base64
  database-name: "ZGJfbmFtZQ=="      # echo -n 'db_name' | base64
  database-user: "ZGJfdXNlcg=="      # echo -n 'db_user' | base64
  database-password: "ZGJfcGFzcw=="  # echo -n 'db_pass' | base64
  database-host: "ZGJfaG9zdA=="      # echo -n 'db_host' | base64
  sentry-dsn: "c2VudHJ5X2Rzbl91cmw=" # echo -n 'sentry_dsn_url' | base64
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: mwalimu-school
  labels:
    app: redis
type: Opaque
data:
  password: "cmVkaXNfcGFzcw=="  # echo -n 'redis_pass' | base64
---
apiVersion: v1
kind: Secret
metadata:
  name: ssl-certs
  namespace: mwalimu-school
  labels:
    app: nginx
type: kubernetes.io/tls
data:
  # Replace with actual SSL certificate data
  tls.crt: |
    LS0tLS1CRUdJTi...  # Base64 encoded certificate
  tls.key: |
    LS0tLS1CRUdJTi...  # Base64 encoded private key
---
# Service Account for secure pod access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: school-service-account
  namespace: mwalimu-school
  labels:
    app: school
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: school-role
  namespace: mwalimu-school
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: school-rolebinding
  namespace: mwalimu-school
subjects:
- kind: ServiceAccount
  name: school-service-account
  namespace: mwalimu-school
roleRef:
  kind: Role
  name: school-role
  apiGroup: rbac.authorization.k8s.io
---
# Network Policies for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: school-network-policy
  namespace: mwalimu-school
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to: []  # Allow egress to external services (database, etc.)
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 443   # HTTPS
    - protocol: TCP
      port: 53    # DNS
    - protocol: UDP
      port: 53    # DNS
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  namespace: mwalimu-school
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 6379
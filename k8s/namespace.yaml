apiVersion: v1
kind: Namespace
metadata:
  name: mwalimu-school
  labels:
    name: mwalimu-school
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: school-quota
  namespace: mwalimu-school
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    services: "10"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: school-limits
  namespace: mwalimu-school
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container
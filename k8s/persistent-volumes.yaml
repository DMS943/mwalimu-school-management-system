apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-pvc
  namespace: mwalimu-school
  labels:
    app: school
    tier: storage
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-storage  # Use appropriate storage class for shared access
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pvc
  namespace: mwalimu-school
  labels:
    app: school
    tier: storage
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: nfs-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: mwalimu-school
  labels:
    app: school
    tier: storage
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard-backup  # Use appropriate backup storage class
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frontend-pvc
  namespace: mwalimu-school
  labels:
    app: school
    tier: storage
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: certbot-pvc
  namespace: mwalimu-school
  labels:
    app: school
    tier: storage
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
---
# Storage Classes (examples - adjust based on your cloud provider)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-ssd
  namespace: mwalimu-school
provisioner: kubernetes.io/aws-ebs  # Change based on cloud provider
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
allowVolumeExpansion: true
reclaimPolicy: Retain
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard-backup
  namespace: mwalimu-school
provisioner: kubernetes.io/aws-ebs
parameters:
  type: st1  # Throughput optimized for backups
  fsType: ext4
  encrypted: "true"
allowVolumeExpansion: true
reclaimPolicy: Retain
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-storage
  namespace: mwalimu-school
provisioner: example.com/nfs  # Use appropriate NFS provisioner
parameters:
  server: nfs-server.example.com
  path: /shared/mwalimu-school
  readOnly: "false"
allowVolumeExpansion: true
reclaimPolicy: Retain
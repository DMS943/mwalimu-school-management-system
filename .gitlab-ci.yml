stages:
  - test
  - build
  - deploy

variables:
  POSTGRES_DB: school_management_test
  POSTGRES_USER: school_admin
  POSTGRES_PASSWORD: test_password
  DATABASE_URL: postgresql://school_admin:test_password@postgres:5432/school_management_test

# Backend Testing
backend-test:
  stage: test
  image: python:3.10
  services:
    - postgres:15
  variables:
    POSTGRES_DB: $POSTGRES_DB
    POSTGRES_USER: $POSTGRES_USER
    POSTGRES_PASSWORD: $POSTGRES_PASSWORD
  before_script:
    - cd backend
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python manage.py check
    - python manage.py makemigrations --check --dry-run
    - python manage.py test
  only:
    - main
    - merge_requests
  cache:
    paths:
      - backend/.pip-cache/

# Frontend Testing
frontend-test:
  stage: test
  image: node:18
  before_script:
    - npm ci
  script:
    - npm run lint || true
    - npm run build
  only:
    - main
    - merge_requests
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# Backend Build
backend-build:
  stage: build
  image: python:3.10
  before_script:
    - cd backend
    - pip install --upgrade pip
    - pip install -r requirements-prod.txt
  script:
    - python manage.py collectstatic --noinput
    - echo "Backend build completed"
  only:
    - main
  artifacts:
    paths:
      - backend/staticfiles/
    expire_in: 1 hour

# Frontend Build
frontend-build:
  stage: build
  image: node:18
  before_script:
    - npm ci
  script:
    - npm run build
    - echo "Frontend build completed"
  only:
    - main
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# Deploy to Staging
deploy-staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to staging server..."
    - ssh $STAGING_USER@$STAGING_SERVER "cd $STAGING_PATH && git pull origin main"
    - ssh $STAGING_USER@$STAGING_SERVER "cd $STAGING_PATH/backend && source venv/bin/activate && pip install -r requirements.txt"
    - ssh $STAGING_USER@$STAGING_SERVER "cd $STAGING_PATH/backend && source venv/bin/activate && python manage.py migrate"
    - ssh $STAGING_USER@$STAGING_SERVER "cd $STAGING_PATH/backend && source venv/bin/activate && python manage.py collectstatic --noinput"
    - ssh $STAGING_USER@$STAGING_SERVER "cd $STAGING_PATH && npm install && npm run build"
    - ssh $STAGING_USER@$STAGING_SERVER "sudo systemctl restart school-backend"
    - ssh $STAGING_USER@$STAGING_SERVER "sudo systemctl restart nginx"
    - echo "Staging deployment completed"
  environment:
    name: staging
    url: https://staging.yourschool.com
  only:
    - main
  when: manual

# Deploy to Production
deploy-production:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache openssh-client git curl
    - docker info
    # Verify required environment variables
    - |
      if [ -z "$SECRET_KEY" ] || [ -z "$DATABASE_NAME" ] || [ -z "$DATABASE_USER" ] || [ -z "$DATABASE_PASSWORD" ]; then
        echo "ERROR: Missing required environment variables"
        echo "Please set: SECRET_KEY, DATABASE_NAME, DATABASE_USER, DATABASE_PASSWORD in GitLab CI/CD variables"
        exit 1
      fi
  script:
    - echo "Starting production deployment..."
    
    # Create .env file for production
    - |
      cat > .env.production << EOF
      DEBUG=False
      SECRET_KEY=${SECRET_KEY}
      DATABASE_NAME=${DATABASE_NAME:-school_management}
      DATABASE_USER=${DATABASE_USER:-school_admin}
      DATABASE_PASSWORD=${DATABASE_PASSWORD}
      DATABASE_HOST=postgres
      DATABASE_PORT=5432
      ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      EOF
    
    # Stop any existing containers
    - docker-compose -f docker-compose.prod.yml down --remove-orphans || true
    
    # Build images
    - echo "Building Docker images..."
    - docker-compose -f docker-compose.prod.yml --env-file .env.production build --no-cache
    
    # Start services
    - echo "Starting services..."
    - docker-compose -f docker-compose.prod.yml --env-file .env.production up -d postgres
    - sleep 15
    
    # Check database is ready
    - docker-compose -f docker-compose.prod.yml --env-file .env.production exec -T postgres pg_isready -U ${DATABASE_USER:-school_admin} -d ${DATABASE_NAME:-school_management}
    
    # Start backend
    - docker-compose -f docker-compose.prod.yml --env-file .env.production up -d backend
    - sleep 30
    
    # Start frontend and nginx
    - docker-compose -f docker-compose.prod.yml --env-file .env.production up -d frontend nginx
    
    # Health check
    - sleep 30
    - docker-compose -f docker-compose.prod.yml ps
    
    # Test endpoints
    - echo "Testing backend health..."
    - timeout 60 sh -c 'until docker-compose -f docker-compose.prod.yml exec -T backend python manage.py check; do sleep 5; done'
    
    - echo "Production deployment completed successfully"
  environment:
    name: production
    url: https://yourschool.com
  only:
    - main
  when: manual
  timeout: 45m
  artifacts:
    reports:
      dotenv: .env.production
    expire_in: 1 hour

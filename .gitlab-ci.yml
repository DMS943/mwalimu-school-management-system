stages:
  - validate
  - test
  - build
  - security
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DJANGO_SETTINGS_MODULE: config.testing
  DATABASE_NAME: test_school
  DATABASE_USER: test
  DATABASE_PASSWORD: test
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  POSTGRES_DB: test_school
  POSTGRES_USER: test
  POSTGRES_PASSWORD: test
  POSTGRES_HOST_AUTH_METHOD: trust
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

cache:
  key:
    files:
      - package-lock.json
      - backend/requirements.txt
      - backend/requirements-dev.txt
  paths:
    - .cache/pip/
    - .cache/npm/

validate:
  stage: validate
  image: python:3.11-slim
  script:
    - python - <<'PY'
      import yaml
      with open('.gitlab-ci.yml', encoding='utf-8') as stream:
          yaml.safe_load(stream)
      print('GitLab CI YAML is valid')
      PY
  before_script:
    - pip install --no-cache-dir pyyaml

backend_tests:
  stage: test
  image: python:3.11-slim
  services:
    - name: postgres:15-alpine
      alias: postgres
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client
    - cd backend
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt -r requirements-dev.txt
    - until pg_isready -h "$DATABASE_HOST" -p "$DATABASE_PORT" -U "$DATABASE_USER"; do sleep 2; done
  script:
    - python manage.py check
    - python manage.py makemigrations --check --dry-run
    - python manage.py migrate --noinput
    - pytest --tb=short --junitxml=test-results.xml --cov=. --cov-report=xml:coverage.xml
  artifacts:
    when: always
    reports:
      junit: backend/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage.xml
      - backend/test-results.xml
    expire_in: 1 week

frontend_checks:
  stage: test
  image: node:20-alpine
  before_script:
    - npm ci --cache "$npm_config_cache" --prefer-offline
  script:
    - npm run lint
    - npm run type-check
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

security:
  stage: security
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir pip-audit
  script:
    - pip-audit -r backend/requirements.txt

build_images:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" ./backend
    - docker build --pull -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" -f Dockerfile.frontend .
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Deployment is intentionally manual and only runs after all checks pass.
deploy_production:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_USER"
    - test -n "$DEPLOY_PATH"
    - test -n "$SSH_PRIVATE_KEY"
    - eval "$(ssh-agent -s)"
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && git pull --ff-only origin '$CI_DEFAULT_BRANCH' && docker compose -f docker-compose.prod.yml up -d --build && docker compose -f docker-compose.prod.yml ps"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: false
  needs:
    - backend_tests
    - frontend_checks
    - security
    - build_images

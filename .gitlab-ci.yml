stages:
  - test
  - build
  - deploy

variables:
  POSTGRES_DB: school_management_test
  POSTGRES_USER: school_admin
  POSTGRES_PASSWORD: test_password
  DATABASE_URL: postgresql://school_admin:test_password@postgres:5432/school_management_test

# Backend Testing
backend-test:
  stage: test
  image: python:3.10
  services:
    - postgres:15
  variables:
    POSTGRES_DB: $POSTGRES_DB
    POSTGRES_USER: $POSTGRES_USER
    POSTGRES_PASSWORD: $POSTGRES_PASSWORD
  before_script:
    - cd backend
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python manage.py check
    - python manage.py makemigrations --check --dry-run
    - python manage.py test
  only:
    - main
    - merge_requests
  cache:
    paths:
      - backend/.pip-cache/

# Frontend Testing
frontend-test:
  stage: test
  image: node:18
  before_script:
    - npm ci
  script:
    - npm run lint || true
    - npm run build
  only:
    - main
    - merge_requests
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# Backend Build
backend-build:
  stage: build
  image: python:3.10
  before_script:
    - cd backend
    - pip install --upgrade pip
    - pip install -r requirements-prod.txt
  script:
    - python manage.py collectstatic --noinput
    - echo "Backend build completed"
  only:
    - main
  artifacts:
    paths:
      - backend/staticfiles/
    expire_in: 1 hour

# Frontend Build
frontend-build:
  stage: build
  image: node:18
  before_script:
    - npm ci
  script:
    - npm run build
    - echo "Frontend build completed"
  only:
    - main
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# Deploy to Staging
deploy-staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to staging server..."
    - ssh $STAGING_USER@$STAGING_SERVER "cd $STAGING_PATH && git pull origin main"
    - ssh $STAGING_USER@$STAGING_SERVER "cd $STAGING_PATH/backend && source venv/bin/activate && pip install -r requirements.txt"
    - ssh $STAGING_USER@$STAGING_SERVER "cd $STAGING_PATH/backend && source venv/bin/activate && python manage.py migrate"
    - ssh $STAGING_USER@$STAGING_SERVER "cd $STAGING_PATH/backend && source venv/bin/activate && python manage.py collectstatic --noinput"
    - ssh $STAGING_USER@$STAGING_SERVER "cd $STAGING_PATH && npm install && npm run build"
    - ssh $STAGING_USER@$STAGING_SERVER "sudo systemctl restart school-backend"
    - ssh $STAGING_USER@$STAGING_SERVER "sudo systemctl restart nginx"
    - echo "Staging deployment completed"
  environment:
    name: staging
    url: https://staging.yourschool.com
  only:
    - main
  when: manual

# Deploy to Production
deploy-production:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
    # Reduce resource usage
    DOCKER_BUILDKIT: 1
  before_script:
    - apk add --no-cache openssh-client git curl
    - docker info
    # Check available resources
    - df -h
    - free -h
    # Verify required environment variables
    - |
      echo "=== Environment Variable Check ==="
      if [ -z "$SECRET_KEY" ]; then
        echo "ERROR: SECRET_KEY not set"
        exit 1
      fi
      if [ -z "$DATABASE_NAME" ]; then
        echo "ERROR: DATABASE_NAME not set"  
        exit 1
      fi
      if [ -z "$DATABASE_USER" ]; then
        echo "ERROR: DATABASE_USER not set"
        exit 1
      fi
      if [ -z "$DATABASE_PASSWORD" ]; then
        echo "ERROR: DATABASE_PASSWORD not set"
        exit 1
      fi
      echo "✅ All required environment variables are set"
  script:
    - echo "=== Starting production deployment ==="
    
    # Create .env file for production
    - |
      echo "=== Creating .env.production file ==="
      cat > .env.production << EOF
      DEBUG=False
      SECRET_KEY=${SECRET_KEY}
      DATABASE_NAME=${DATABASE_NAME:-school_management}
      DATABASE_USER=${DATABASE_USER:-school_admin}
      DATABASE_PASSWORD=${DATABASE_PASSWORD}
      DATABASE_HOST=postgres
      DATABASE_PORT=5432
      ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      EOF
      echo "✅ Environment file created"
    
    # Clean up any existing containers and free space
    - |
      echo "=== Cleaning up existing resources ==="
      docker-compose -f docker-compose.prod.yml down --remove-orphans --volumes || true
      docker system prune -f --volumes || true
      echo "Available disk space after cleanup:"
      df -h
    
    # Build images one by one to reduce memory pressure
    - |
      echo "=== Building Docker images sequentially ==="
      set -e
      
      # Build backend only first
      echo "Building backend image..."
      docker-compose -f docker-compose.prod.yml --env-file .env.production build backend
      
      # Build frontend
      echo "Building frontend image..."
      docker-compose -f docker-compose.prod.yml --env-file .env.production build frontend
      
      echo "✅ Images built successfully"
    
    # Start services one by one with health checks
    - |
      echo "=== Starting services sequentially ==="
      
      # Start database first
      echo "Starting PostgreSQL..."
      docker-compose -f docker-compose.prod.yml --env-file .env.production up -d postgres
      
      # Wait for database with timeout
      echo "Waiting for database (max 60s)..."
      timeout 60 sh -c 'until docker-compose -f docker-compose.prod.yml --env-file .env.production exec -T postgres pg_isready -U ${DATABASE_USER:-school_admin}; do sleep 2; done'
      
      if [ $? -ne 0 ]; then
        echo "❌ Database startup timeout"
        docker-compose -f docker-compose.prod.yml logs postgres
        exit 1
      fi
      echo "✅ Database ready"
      
      # Start backend
      echo "Starting backend..."
      docker-compose -f docker-compose.prod.yml --env-file .env.production up -d backend
      
      # Wait for backend health check
      echo "Waiting for backend health check..."
      sleep 30
      timeout 60 sh -c 'until docker-compose -f docker-compose.prod.yml --env-file .env.production exec -T backend python manage.py check; do sleep 5; done'
      
      if [ $? -ne 0 ]; then
        echo "❌ Backend startup failed"
        docker-compose -f docker-compose.prod.yml logs backend
        exit 1
      fi
      echo "✅ Backend ready"
      
      # Start frontend and nginx
      echo "Starting frontend and nginx..."
      docker-compose -f docker-compose.prod.yml --env-file .env.production up -d frontend nginx
      
      sleep 20
      echo "✅ All services started"
    
    # Final status check
    - |
      echo "=== Final deployment status ==="
      docker-compose -f docker-compose.prod.yml ps
      
      # Check if any containers failed
      if docker-compose -f docker-compose.prod.yml ps | grep -q "Exit\|Restarting"; then
        echo "❌ Some containers are not healthy"
        docker-compose -f docker-compose.prod.yml logs --tail=50
        exit 1
      fi
      
      echo "🎉 Production deployment completed successfully!"
  environment:
    name: production
    url: https://yourschool.com
  only:
    - main
  when: manual
  timeout: 30m
  artifacts:
    reports:
      dotenv: .env.production
    expire_in: 1 hour
